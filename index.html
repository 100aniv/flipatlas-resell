/* ============================================================ sections & grid */
.section { margin: 18px 0 8px; }
.section-h { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; }
.section-h h2 { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.section-h .desc { font-size: 12.5px; color: var(--text-3); }
.section-h .n { font-size: 13px; font-weight: 700; color: var(--text-3); }
details.section > summary { list-style: none; cursor: pointer; min-height: var(--tap); display: flex; align-items: center; gap: 8px; padding: 0 2px; margin-bottom: 8px; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary .chev { transition: transform .15s; color: var(--text-3); width: 20px; height: 20px; }
details.section[open] > summary .chev { transform: rotate(90deg); }
details.section > summary h2 { font-size: 17px; font-weight: 800; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.split { display: block; }
.detail-pane { display: none; }
@media (min-width: 1024px) {
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; align-items: start; }
  .detail-pane {
    display: block; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow);
    overscroll-behavior: contain;
  }
  .detail-pane .detail-body { padding: 18px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1700px) {
  .split { grid-template-columns: minmax(0, 1fr) 460px; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.detail-empty { padding: 48px 24px; text-align: center; color: var(--text-3); }
.detail-empty svg { width: 40px; height: 40px; margin-bottom: 8px; opacity: .6; }

/* ============================================================ recommendation card */
.rec { cursor: pointer; transition: border-color .12s, box-shadow .12s; position: relative; display: flex; flex-direction: column; gap: 10px; }
.rec:hover { border-color: var(--border-strong); }
.rec.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.rec.g-S { border-top: 3px solid var(--gS); }
.rec-top { display: flex; gap: 10px; align-items: flex-start; }
.rec-title { flex: 1; min-width: 0; }
.eyebrow { font-size: 12px; color: var(--text-3); font-weight: 650; display: flex; gap: 6px; align-items: center; min-width: 0; }
.eyebrow > span { white-space: nowrap; flex: none; }
.eyebrow > .ellip { flex: 1 1 auto; min-width: 0; }
.rec-title h3 { font-size: 15.5px; font-weight: 750; margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rec-title .opt { font-size: 12.5px; color: var(--text-2); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.thumb-wrap { position: relative; flex: none; display: block; }
.thumb-wrap > .grade { position: absolute; top: -6px; left: -6px; box-shadow: 0 0 0 2px var(--surface); }
.thumb { position: relative; display: grid; place-items: center; width: 72px; height: 72px; border-radius: 12px; overflow: hidden; flex: none;
  background: var(--surface-2); border: 1px solid var(--border); }
.thumb .ini { font-weight: 800; font-size: 24px; color: var(--text-3); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #f3f4f6; }
.thumb.sm { width: 44px; height: 44px; border-radius: 10px; }
.thumb.sm .ini { font-size: 16px; }
.thumb.lg { width: 112px; height: 112px; border-radius: 16px; }
.thumb.lg .ini { font-size: 38px; }
@media (min-width: 1024px) { .rec .rec-top .thumb { width: 96px; height: 96px; } .thumb.lg { width: 140px; height: 140px; } }
/* reco card: score, size/store pickers, engine figures */
.score { flex: none; text-align: right; min-width: 66px; display: flex; flex-direction: column; align-items: flex-end; }
.score b { font-size: 26px; font-weight: 850; letter-spacing: -0.03em; line-height: 1.05; color: var(--text); }
.score i { font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--text-2); margin-top: 1px; }
.score small { font-size: 10.5px; font-weight: 650; color: var(--text-3); margin-top: 1px; white-space: nowrap; }
.score.na b { font-size: 14px; font-weight: 800; color: var(--text-2); line-height: 1.25; max-width: 76px; }
.why { margin: 0; font-size: 12.5px; color: var(--text-2); background: var(--accent-soft); border-radius: 10px; padding: 7px 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.why b { color: var(--accent-text); font-weight: 750; margin-right: 4px; }
.pick-wrap { min-width: 0; }
.pick-h { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 700; color: var(--text-3); margin: 0 2px 5px; }
.pick-h span:last-child { font-weight: 500; text-align: right; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pk { display: flex; flex-direction: column; gap: 1px; align-items: flex-start; min-height: 46px; min-width: 64px; max-width: 100%; padding: 5px 10px; border-radius: 10px; text-align: left;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
.pk b { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 5px; max-width: 100%; }
.pk span { font-size: 11px; color: var(--text-3); max-width: 100%; }
.pk:hover { background: var(--surface-2); }
.pk[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.pk[aria-pressed="true"] span { color: var(--accent-text); }
.pk.fail { background: var(--surface-2); border-style: dashed; color: var(--text-3); }
.pk.fail b { color: var(--text-3); }
.pk.fail[aria-pressed="true"] { background: var(--accent-soft); color: var(--text-2); }
.pk.fail[aria-pressed="true"] b { color: var(--text-2); }
.pk.st { min-width: 118px; max-width: 100%; }
.pk.st.soldout { border-style: dashed; }
.pk .tag { font-style: normal; flex: none; font-size: 10px; font-weight: 800; line-height: 1; padding: 2px 5px; border-radius: 5px; background: var(--pos-soft); color: var(--pos); }
.pk .tag.bad { background: var(--neg-soft); color: var(--neg); }
.pk.rep .tag { background: var(--accent); color: var(--accent-ink); }
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
@media (min-width: 1024px) { .figs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.fig { min-width: 0; }
.fig label { display: block; font-size: 11.5px; font-weight: 650; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fig b { display: block; font-size: 14px; font-weight: 760; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fig span { display: block; font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-hist { margin: 0; font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 7px 10px; }
.gate-line { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; border-radius: 10px; padding: 6px 10px; }
.gate-line svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.gate-line.ok { background: var(--pos-soft); color: var(--pos); }
.gate-line.fail { background: var(--neg-soft); color: var(--neg); }
.gate-line.warn { background: var(--warn-soft); color: var(--warn); }
.store-box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sb-h { font-size: 13px; }
.sb-h b { display: flex; align-items: center; gap: 5px; }
.sb-h svg { width: 15px; height: 15px; flex: none; color: var(--text-3); }
.kvs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 12.5px; margin: 0; align-items: center; }
.kvs dt { color: var(--text-3); white-space: nowrap; }
.kvs dd { margin: 0; text-align: right; min-width: 0; }
.snap { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 11.5px; color: var(--text-3); }
.snap svg { width: 14px; height: 14px; flex: none; }
.cmp-btn { cursor: pointer; border: 0; }
.comps { display: grid; gap: 5px; }
.comp { display: grid; grid-template-columns: 96px minmax(0, 1fr) 42px 58px; gap: 8px; align-items: center; font-size: 12.5px; }
.comp .cl { color: var(--text-2); font-weight: 650; white-space: nowrap; }
.comp .cl em { font-style: normal; color: var(--text-3); font-weight: 500; margin-left: 4px; font-size: 11px; }
.comp .cb { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.comp .cb i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.comp .cv { text-align: right; font-weight: 700; }
.comp .cpt { text-align: right; color: var(--text-2); font-weight: 650; white-space: nowrap; font-size: 11.5px; }
.comp .cpt small { color: var(--text-3); font-weight: 500; font-size: 10.5px; }
.d-head .score { margin-left: auto; }
.store-tbl { min-width: 520px; font-size: 12.5px; }
.store-tbl th, .store-tbl td { padding: 8px 6px; }
.store-tbl tr[data-act] { cursor: pointer; }
.store-tbl tr.best td { background: color-mix(in srgb, var(--pos-soft) 60%, var(--surface)); }
.store-tbl tr.cur td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.store-tbl tr:hover td { background: var(--surface-2); }
.size-tbl td.gcell { white-space: normal; text-align: left; min-width: 110px; }
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; margin: 0 -2px; border: 1px solid var(--border); border-radius: 10px; }
.size-tbl { min-width: 600px; font-size: 12.5px; }
.size-tbl th, .size-tbl td { padding: 8px 6px; }
.size-tbl th:first-child, .size-tbl td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.size-tbl tr[data-act] { cursor: pointer; }
.size-tbl tr.best td { background: color-mix(in srgb, var(--pos-soft) 75%, var(--surface)); }
.size-tbl tr.fail td { color: var(--text-3); }
.size-tbl tr.fail td .pos, .size-tbl tr.fail td .neg { color: var(--text-3); }
.size-tbl tr.cur td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.size-tbl tr:hover td { background: var(--surface-2); }

.profit { display: grid; grid-template-columns: 1.25fr 1fr; gap: 8px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.kpi label { display: block; font-size: 11.5px; font-weight: 650; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi b { display: block; font-size: 19px; font-weight: 820; letter-spacing: -0.02em; line-height: 1.25; white-space: nowrap; }
.kpi .roi { font-size: 12.5px; font-weight: 700; }
.kpi.main { background: color-mix(in srgb, var(--pos-soft) 70%, var(--surface-2)); }
.kpi.main.is-neg { background: var(--neg-soft); }
.kpi.secondary b { font-size: 16px; }

.pay { font-size: 12.5px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.pay .lbl { color: var(--text-3); margin-right: 3px; }
.dual { white-space: nowrap; }
.dual .k { color: var(--text-3); margin-left: 4px; font-size: .92em; }

.scen { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.scen > div { padding: 6px 4px 7px; text-align: center; min-width: 0; border-left: 1px solid var(--border); }
.scen > div:first-child { border-left: 0; }
.scen .t { display: block; font-size: 10.5px; font-weight: 700; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scen .p { display: block; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scen .n { display: block; font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scen .be { background: var(--surface-2); }
.scen-unit { font-size: 10.5px; color: var(--text-3); text-align: right; margin-top: -6px; }

.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp > div { border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.cmp .h { font-size: 11.5px; font-weight: 700; color: var(--text-3); display: flex; justify-content: space-between; gap: 4px; }
.cmp .h span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp b { font-size: 14.5px; font-weight: 780; white-space: nowrap; }
.cmp .d { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.rec-foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 2px; }
.rec-foot .loc { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
.rec-foot .loc svg { width: 15px; height: 15px; flex: none; color: var(--text-3); }


/* pricing / coupons */
.pricing { display: flex; flex-direction: column; gap: 4px; }
.pr-main { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.pr-main .lbl { font-size: 12.5px; color: var(--text-3); }
.pr-main s { color: var(--text-3); font-size: 13px; }
.pr-main .arrow { color: var(--text-3); font-size: 13px; }
.pr-main b { font-size: 16px; font-weight: 800; }
.pr-main .k { font-size: 12.5px; color: var(--text-3); }
.pr-main .chip { align-self: center; }
.cp-line { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); min-width: 0; }
.cp-line svg { width: 15px; height: 15px; flex: none; color: var(--accent-text); }
.cp { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: var(--surface); }
.cp.applied { border-color: color-mix(in srgb, var(--pos) 45%, transparent); background: color-mix(in srgb, var(--pos-soft) 55%, var(--surface)); }
.cp.not { background: var(--surface-2); }
.cp-h { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.cp-h b.grow { font-weight: 750; }
.cp-kv { margin-top: 8px; font-size: 12.5px; }
.cp-kv dd { text-align: left; color: var(--text-2); }
.cp .steps li { font-size: 13px; }
/* action badge (primary) + lottery plan */
.act { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12.5px; font-weight: 800; white-space: nowrap; flex: none; }
.act.buy { background: var(--pos); color: var(--surface); }
.act.lot { background: var(--gS); color: var(--gS-ink); }
.act.watch { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--warn) 50%, transparent); }
.act.none { background: var(--surface-2); color: var(--text-3); }
.act.hunt { background: var(--info-soft); color: var(--info); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--info) 45%, transparent); }
.act.wait { background: var(--accent-soft); color: var(--accent-text); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 45%, transparent); }
.act-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
.section-h .act, details.section > summary .act { height: 28px; font-size: 13.5px; padding: 0 11px; }
.lot-box { border-radius: 10px; padding: 8px 10px; background: color-mix(in srgb, var(--gS) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--gS) 30%, transparent); }
.lot-box.big { margin-bottom: 10px; }
.lot-row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 6px; font-size: 12.5px; padding: 2px 0; }
.lot-k { color: var(--text-3); font-weight: 700; }
.lot-v { min-width: 0; }
.warnc { color: var(--warn); }
/* match review */
.match-box { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 10px 12px; background: var(--surface); cursor: default; }
.match-box.compact { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.mb-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.mb-col { min-width: 0; background: var(--surface-2); border-radius: 10px; padding: 8px; }
.match-box.compact .mb-col { background: var(--surface); }
.mb-l { display: block; font-size: 11px; font-weight: 750; color: var(--text-3); margin-bottom: 4px; letter-spacing: .02em; }
.mb-t { font-size: 13px; font-weight: 650; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mb-col .thumb.sm { width: 40px; height: 40px; }
.mb-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.mb-btns .btn { min-height: var(--tap); padding: 0 6px; white-space: normal; line-height: 1.2; font-size: 13px; }
.mb-btns .btn.on.ok { background: var(--pos); border-color: var(--pos); color: var(--surface); }
.mb-btns .btn.on.bad { background: var(--neg); border-color: var(--neg); color: var(--surface); }
.mb-btns .btn.on.warn { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.match-box .input { min-height: 40px; }
/* ============================================================ detail content */
.d-head { display: flex; gap: 12px; align-items: flex-start; }
.d-head h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.d-sec { margin-top: 18px; }
.d-sec > h4 { font-size: 13px; font-weight: 750; color: var(--text-3); margin-bottom: 8px; letter-spacing: 0; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 13.5px; }
.kv dt { color: var(--text-3); white-space: nowrap; }
.kv dd { margin: 0; text-align: right; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: right; font-weight: 650; color: var(--text-3); font-size: 11.5px; padding: 6px 4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td .sub { display: block; font-size: 11px; color: var(--text-3); font-weight: 500; }
.tbl td b { font-weight: 750; }
.note { font-size: 12.5px; color: var(--text-2); background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 4px 0 4px 32px; font-size: 13.5px; min-height: 28px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 auto; }

/* ============================================================ stores */
.map-card { padding: 10px; }
.map-svg { width: 100%; height: auto; max-height: 330px; display: block; margin: 0 auto; }
.map-svg .loop { fill: none; stroke: var(--border-strong); stroke-width: 2.5; stroke-dasharray: 2 5; stroke-linecap: round; }
.map-svg .st circle { fill: var(--surface); stroke: var(--text-3); stroke-width: 1.5; }
.map-svg .st text { fill: var(--text-3); font-size: 11px; font-weight: 600; }
.map-svg .b circle { fill: var(--accent); fill-opacity: .2; stroke: var(--accent); stroke-width: 2; }
.map-svg .b.hasS circle { fill: var(--gS); stroke: var(--gS); fill-opacity: 1; }
.map-svg .b text { fill: var(--text); font-size: 12px; font-weight: 750; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.map-svg .b text.c { fill: var(--accent-text); stroke: none; font-size: 11px; font-weight: 800; }
.map-svg .b.hasS text.c { fill: var(--gS-ink); }
.map-svg .b { cursor: pointer; }
.map-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-3); padding: 4px 4px 0; }
.map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }

.region-h { display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; margin: 20px 2px 10px; }
.region-h h2 { font-size: 17px; font-weight: 800; }
.bld { cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.bld.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.bld-top { display: flex; gap: 10px; align-items: flex-start; }
.prio { flex: none; width: 44px; text-align: center; border-radius: 10px; background: var(--surface-2); padding: 4px 0; }
.prio b { display: block; font-size: 18px; font-weight: 850; line-height: 1.1; }
.prio span { font-size: 10.5px; color: var(--text-3); font-weight: 700; }
.prio.p1 { background: var(--accent); color: var(--accent-ink); }
.prio.p1 span { color: inherit; opacity: .85; }
.bld h3 { font-size: 16px; font-weight: 780; }
.bld .ja { font-size: 12px; color: var(--text-3); }

    S.loadError = String(e && e.message || e);

  if (la && ls < la - 1000) return { c: 'bad', l: '최근 시도 실패' };
  if (!/^(OK|SUCCESS|SUCCEEDED|DONE)$/.test(st)) return { c: 'warn', l: st || '상태 불명' };
  if ((Date.now() - ls) / 60000 > 90) return { c: 'warn', l: '지연' };
  return { c: 'ok', l: '정상' };
}
function viewStatus() {

  var kaS = kreamAge();
  h += '<div class="banner ' + (!kaS || kaS.min > 60 ? 'warn' : 'info') + '" style="margin:0 0 4px">' + IC.clock + '<div class="grow small">' + kreamNote() + '. PC가 꺼져 있으면 갱신되지 않습니다.</div></div>';
  if (!srcs.length) h += '<p class="muted small" style="margin:0">Source_Status 기록이 없습니다 — 수집기가 한 번도 보고하지 않았습니다. 정상으로 간주하지 않습니다.</p>';
  h += srcs.map(function (s) {

    return '<div class="src"><span class="pill ' + st.c + '">' + st.l + '</span><div class="grow"><b>' + esc(s.source) + '</b> <span class="muted small">' + esc([s.runner, N(s.items) !== null ? s.items + '건' : ''].filter(Boolean).join(' · ')) + '</span>' +
      '<div class="small">마지막 성공 <b>' + (s.last_success_at ? esc(ago(s.last_success_at)) : '없음') + '</b> <span class="muted">' + esc(dt(s.last_success_at)) + '</span></div>' +
      '<div class="small muted">마지막 시도 ' + (s.last_attempt_at ? esc(ago(s.last_attempt_at)) + ' · ' + esc(dt(s.last_attempt_at)) : '없음') + ' · 상태값 ' + esc(s.status || '—') + '</div>' +
      (s.error ? '<div class="err">' + esc(s.error) + '</div>' : '') + '</div></div>';
  }).join('');
  h += '</section>';
  h += '</div><div class="stack">';
  // FX
  var fx = M.fx;
  h += '<section class="card"><div class="card-h"><h2>환율</h2>' + (fx ? (String(fx.status || '').toUpperCase() === 'OK' ? '<span class="pill ok">정상</span>' : '<span class="pill bad">' + esc(fx.status || '상태 불명') + '</span>') : '') + '</div>' +
    (fx ? '<dl class="kv"><dt>JPY → KRW</dt><dd><b class="num" style="font-size:18px">' + (N(fx.rate) ? Number(fx.rate).toFixed(4) : '—') + '</b> 원/엔</dd><dt>카드 적용 환율</dt><dd class="num">' + (N(fx.card_rate) ? Number(fx.card_rate).toFixed(4) : '—') + ' <span class="muted small">수수료 ' + tPct(fx.card_fee_rate) + '</span></dd>' +
      '<dt>공급자</dt><dd>' + esc(fx.provider || '—') + '</dd><dt>공급자 갱신</dt><dd>' + esc(dt(fx.provider_updated_at, true)) + ' <span class="muted small">' + (fx.provider_updated_at ? esc(ago(fx.provider_updated_at)) : '') + '</span></dd>' +
      '<dt>가져온 시각</dt><dd>' + fresh(fx.fetched_at, 180) + '</dd></dl>' : '<p class="muted small" style="margin:0">FX 데이터 없음 — 원화 환산은 추천 행에 저장된 환율만 사용합니다.</p>') + '</section>';
  // KREAM fee
  var t = M.tier;
  h += '<section class="card"><div class="card-h"><h2>KREAM 수수료 등급</h2>' + (t ? '<span class="chip acc">' + esc(t.level || '') + '</span>' : '') + '</div>' +
    (t ? '<dl class="kv"><dt>요율 · 고정비</dt><dd class="num">' + tPct(t.rate) + ' + ₩' + fmt(N(t.fixed_krw) || 0) + '</dd><dt>VAT · 상한</dt><dd class="num">' + tPct(t.vat_rate) + ' · ' + tKrw(t.cap_krw_incl_vat) + '</dd>' +
      '<dt>적용 기간</dt><dd>' + esc(String(t.valid_from || '').slice(0, 10)) + ' ~ ' + esc(String(t.valid_to || '').slice(0, 10)) + '</dd><dt>예: ₩200,000 판매</dt><dd class="num">수수료 ' + tKrw(kreamFee(200000)) + '</dd></dl><p class="muted xs" style="margin:6px 0 0">수수료 = MIN(상한, (고정비 + 판매가×요율)×(1+VAT)) · 출처 ' + esc(t.source || '—') + '</p>'
      : '<p class="muted small" style="margin:0">Fee_Tiers에 현재 등급이 없습니다. (config/kream_fees.yaml 기준 값이 시트에 반영되면 표시)</p>') + '</section>';
  // data
  h += '<section class="card"><div class="card-h"><h2>데이터</h2><button class="btn sm" type="button" data-act="reload">' + IC.refresh.replace('<svg', '<svg width="16" height="16"') + '새로고침</button></div><dl class="kv">' +
    '<dt>서버 시각</dt><dd>' + esc(dt(S.raw && S.raw.server_time, true)) + '</dd><dt>받은 시각</dt><dd>' + (S.fetchedAt ? esc(dt(new Date(S.fetchedAt).toISOString(), true)) + (S.fromCache ? ' <span class="chip warn">사본</span>' : '') : '—') + '</dd></dl>' +
    '<div class="chips" style="margin-top:10px">' + Object.keys((S.raw && S.raw.sheets) || {}).map(function (n) { var i = sheetInfo(n); return chip(i.state === 'missing' ? 'bad' : i.state === 'empty' ? '' : 'ok', esc(n) + ' ' + (i.state === 'missing' ? '없음' : i.n)); }).join('') + '</div></section>';
  h += '<section class="card"><div class="card-h"><h2>통관 안내</h2></div><div class="note">통관비 제외 예상입니다. 판매 목적(상용) 물품은 금액과 무관하게 여행자 면세 대상이 아닐 수 있어 세관 신고·통관 대상일 수 있습니다(관세청 기준). 계산에는 관세·부가세가 포함되지 않았습니다.</div></section>';
  return h + '</div></div>';
}
function alertRow(a) {
  var k = alertKind(a.type), acked = isAcked(a);
  var p = M.P[a.product_id];
  var bg = { bad: 'var(--neg-soft);color:var(--neg)', warn: 'var(--warn-soft);color:var(--warn)', ok: 'var(--pos-soft);color:var(--pos)', acc: 'var(--accent-soft);color:var(--accent-text)', line: 'var(--surface-2);color:var(--text-2)' }[k.c];
  return '<div class="alert-i"' + (acked ? ' style="opacity:.6"' : '') + '><span class="ic" style="background:' + bg + '">' + IC[k.i] + '</span><div class="grow"><div class="row wrap" style="gap:6px">' + chip(k.c, esc(k.l)) + '<span class="xs muted">' + esc(ago(a.created_at)) + '</span>' + '</div>' +
    '<div class="small" style="margin-top:3px">' + esc(a.message || '') + '</div>' + (p || a.store_id ? '<div class="xs muted">' + esc([p ? (p.name_ko || p.name_en) : a.product_id, a.option, storeLabel(a.store_id)].filter(Boolean).join(' · ')) + '</div>' : '') + '</div>' +

/* =================================================================== sheet / toast / clipboard */
function openSheet(o, keepScroll) {
  var el = $('#sheet'), body = $('#sheetBody');
  var st = keepScroll ? body.scrollTop : 0;
  S.sheet = o;
  $('#sheetTitle').textContent = o.title || '';
  body.innerHTML = o.body || '';
  var f = $('#sheetFoot'); if (o.foot) { f.innerHTML = o.foot; f.hidden = false; } else { f.hidden = true; f.innerHTML = ''; }
  if (el.hidden) { el.hidden = false; document.body.style.overflow = 'hidden'; S.lastFocus = document.activeElement; setTimeout(function () { var c = $('.sheet-h [data-close]'); if (c) c.focus(); }, 30); }
  body.scrollTop = st;
}
function closeSheet() {
  var el = $('#sheet'); if (el.hidden) return;
  el.hidden = true; document.body.style.overflow = ''; S.sheet = null;
  if (S.lastFocus && document.body.contains(S.lastFocus)) S.lastFocus.focus();
}
var toastT = null;
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600); }
function copyText(text) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) toast('메모를 복사했습니다'); else openSheet({ kind: 'copy', title: '메모 복사', body: '<p class="small muted">자동 복사가 막혀 있습니다. 아래 내용을 길게 눌러 복사하세요.</p><textarea class="input" rows="12" readonly>' + esc(text) + '</textarea>' });
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('메모를 복사했습니다'); }, fallback);
  else fallback();
}

/* =================================================================== events */
function applyTheme() { document.documentElement.setAttribute('data-theme', 'dark'); }
function setTab(t) {
  if (!TITLES[t]) return;
  S.tab = t; LS.set('tab', t); closeSheet(); renderChrome(); renderMain(); window.scrollTo(0, 0);
  var m = $('#main'); if (m) m.focus({ preventScroll: true });
}
document.addEventListener('click', function (e) {
  if (e.target.closest('[data-close]')) { closeSheet(); return; }

  var a = e.target.closest('[data-act]'); if (!a) return;
  var stop = e.target.closest('[data-stop]'); if (stop && a.contains(stop) && a !== stop) return;
  var id = a.dataset.id, act = a.dataset.act;

    case 'reload': load(true); break;
    case 'goto': setTab(a.dataset.tab); break;
    case 'open-rec': openRec(id); break;
    case 'open-rec-sheet': openRecForOpp(id); break;
    case 'pick-size': e.stopPropagation(); pickSize(id, a.dataset.o); break;
    case 'pick-store': e.stopPropagation(); pickStore(id, a.dataset.s); break;
    case 'toggle-cmp': e.stopPropagation(); S.cmp[id] = !S.cmp[id]; redrawProduct(id); break;
    case 'open-store': openStore(id); break;
    case 'store-view': S.storeView = a.dataset.v === 'region' ? 'region' : 'rank'; LS.set('storeView', S.storeView); renderMain(); break;
    case 'crit-open': S.sel.rec = id; setTab('rec'); if (!isDesk()) openRec(id); break;
    case 'toggle-filters': S.showFilters = !S.showFilters; renderMain(); break;
    case 'clear-filters': S.f = { q: '', region: '', category: '', grade: '', action: '', trip: false, watch: false }; LS.set('filters', S.f); renderMain(); break;
    case 'copy-memo': { var g = M.bmap[id]; if (!g) break; var ta = $('#note-' + CSS.escape(id)); copyText(composeNote(g, ta ? ta.value : personalNote(g))); break; }
    case 'reset-check': {

      checklistItems(g3).forEach(function (i) { delete ck[i.id]; }); LS.set('check', ck); refreshStoreViews(id); break;
    }
  }
});

document.addEventListener('toggle', function (e) {

setInterval(function () { if (!document.hidden) load(false); }, 300000);
setInterval(function () {

/* =================================================================== boot */
applyTheme();
renderChrome();
renderMain();
var snap = LS.get('snapshot', null);
if (snap && snap.d && snap.d.sheets) { try { S.raw = snap.d; S.fetchedAt = snap.at; S.generatedAt = snap.gen || null; S.fromCache = true; build(); renderAll(); } catch (e) { S.raw = null; S.fetchedAt = null; S.fromCache = false; M = null; } }
load(false);
})();
