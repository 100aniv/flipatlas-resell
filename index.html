.sb-head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 4px 10px; border: 0; background: none; color: var(--text); text-align: left; font-size: 12.5px; line-height: 1.35; }
.sb-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--pos); }
.lvl-warn .sb-dot { background: var(--warn); }
.lvl-bad .sb-dot { background: var(--neg); }
.sb-line { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; }
.sb-line > * + *::before { content: "·"; margin-right: 6px; color: var(--text-3); }
.sb-lbl { font-weight: 600; }
.lvl-warn .sb-lbl { color: var(--warn); } .lvl-bad .sb-lbl { color: var(--neg); }
.sb-i { color: var(--text-2); white-space: nowrap; }
.sb-i.stale { color: var(--warn); font-weight: 500; }
.sb-more { display: inline-flex; align-items: center; gap: 2px; flex: none; font-size: 12px; font-weight: 500; color: var(--text-3); }
.sb-more .chev { width: 14px; height: 14px; transition: transform .15s; }
.sb-head[aria-expanded="true"] .sb-more .chev { transform: rotate(90deg); }
.sb-panel { padding: 2px 10px 10px; border-top: 1px solid var(--border); }
.sb-panel[hidden] { display: none; }
.sb-panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sb-panel li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; font-size: 12.5px; line-height: 1.45; background: var(--surface-2); }
.sb-panel li > svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.sb-panel li.bad { background: var(--neg-soft); } .sb-panel li.bad > svg { color: var(--neg); }
.sb-panel li.warn { background: var(--warn-soft); } .sb-panel li.warn > svg { color: var(--warn); }
.sb-panel li.info > svg { color: var(--info); } .sb-panel li.ok > svg { color: var(--pos); }
.sb-panel .btn.sm { min-height: 44px; }
.snap.foot { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 11px; }
@media (max-width: 699.98px) {
  .dash { padding: 4px; margin-bottom: 6px; }
  .dash-tiles { gap: 4px; }
  .dash-meta { display: none; }
  .dt { flex-direction: row; gap: 5px; min-height: 44px; }
}

/* desktop table */
.rec-tblwrap { margin: 0; background: var(--surface); box-shadow: var(--shadow); }
.rec-tbl { font-size: 13px; }
.rec-tbl th, .rec-tbl td { padding: 8px 5px; vertical-align: middle; }
.rec-tbl th { text-align: right; padding: 4px 3px; white-space: normal; vertical-align: bottom; }
.rec-tbl th.c-grade, .rec-tbl td.c-grade { text-align: center; width: 46px; }
.rec-tbl th.c-name, .rec-tbl td.c-name, .rec-tbl th.c-act, .rec-tbl td.c-act { text-align: left; }
.rec-tbl th.c-opt, .rec-tbl td.c-opt { text-align: center; }
.th-sort { border: 0; background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer; padding: 6px 2px; border-radius: 6px; white-space: normal; overflow-wrap: normal; word-break: keep-all; line-height: 1.2; min-height: 32px; text-align: inherit; }
.th-sort:hover { color: var(--text); background: var(--surface-2); }
.rec-tbl th[aria-sort="ascending"] .th-sort::after { content: " \25B2"; font-size: 9px; }
.rec-tbl th[aria-sort="descending"] .th-sort::after { content: " \25BC"; font-size: 9px; }
.rec-tbl th[aria-sort="ascending"], .rec-tbl th[aria-sort="descending"] { color: var(--accent-text); }
.rec-row { cursor: pointer; }
.rec-row:hover td { background: var(--surface-2); }
.rec-row.selected td { background: var(--accent-soft); }
.rec-row.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.rec-tbl td.c-name { white-space: normal; min-width: 120px; width: 99%; }
.rec-tbl td.c-name .tn { display: flex; align-items: center; gap: 8px; width: 0; min-width: 100%; }
.rec-tbl .thumb.sm { width: 36px; height: 36px; border-radius: 8px; }
.rec-tbl .tt { min-width: 0; flex: 1; text-align: left; }
.rec-tbl .tt .t2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; font-weight: 600; line-height: 1.3; white-space: normal; }
.rec-tbl .tt .sub { display: block; }
.rec-tbl .gi, .rec-tbl .oi { display: none; }
.rec-tbl td.c-act { white-space: normal; }
.rec-tbl td.c-act:has(.act.hp) { min-width: 96px; }
.rec-tbl td.c-act .act { height: auto; padding: 3px 7px; white-space: nowrap; line-height: 1.25; font-size: 12px; text-align: left; }
.rec-tbl td.c-act .act.hp { white-space: normal; }
.rec-tbl .sec-row td { padding: 0; background: var(--bg); text-align: left; border-bottom: 0; }
.rec-tbl .empty-row td { text-align: left; color: var(--text-3); padding: 14px 10px; }
.sec-toggle { display: flex; width: 0; min-width: 100%; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px; background: transparent; border: 0; text-align: left; color: inherit; }
.sec-toggle .grow { overflow: hidden; }
.sec-toggle .desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-toggle .chev { transition: transform .15s; color: var(--text-3); width: 20px; height: 20px; flex: none; }
.sec-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.sec-toggle .act { height: 28px; font-size: 13.5px; padding: 0 11px; }
.sec-toggle .n { font-size: 13px; font-weight: 600; color: var(--text-3); }
/* columns drop out as the list column narrows (the side panel always shows everything) */
@media (max-width: 1439.98px) { .rec-tbl .c-ns, .rec-tbl .c-t7, .rec-tbl .c-opt { display: none; } .rec-tbl .oi { display: inline; } }
@media (max-width: 1279.98px) { .rec-tbl .c-cap { display: none; } }
@media (min-width: 1024px) and (max-width: 1199.98px) {
  .split { grid-template-columns: minmax(0, 1fr) 288px; gap: 16px; }
  .rec-tbl .c-grade { display: none; }
  .rec-tbl .gi { display: inline-grid; margin-right: 4px; vertical-align: middle; }
}

.pay { font-size: 12.5px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.pay .lbl { color: var(--text-3); margin-right: 3px; }
.dual { white-space: nowrap; }
.dual .k { color: var(--text-3); margin-left: 4px; font-size: .92em; }

.scen { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.scen > div { padding: 6px 4px 7px; text-align: center; min-width: 0; border-left: 1px solid var(--border); }
.scen > div:first-child { border-left: 0; }
.scen .t { display: block; font-size: 10.5px; font-weight: 600; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scen .p { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scen .n { display: block; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scen .be { background: var(--surface-2); }
.scen-unit { font-size: 10.5px; color: var(--text-3); text-align: right; margin-top: -6px; }

.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp > div { border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.cmp .h { font-size: 11.5px; font-weight: 600; color: var(--text-3); display: flex; justify-content: space-between; gap: 4px; }
.cmp .h span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp b { font-size: 14.5px; font-weight: 600; white-space: nowrap; }
.cmp .d { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.rec-foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 2px; }
.rec-foot .loc { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
.rec-foot .loc svg { width: 15px; height: 15px; flex: none; color: var(--text-3); }


/* pricing / coupons */
.pricing { display: flex; flex-direction: column; gap: 4px; }
.pr-main { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.pr-main .lbl { font-size: 12.5px; color: var(--text-3); }
.pr-main s { color: var(--text-3); font-size: 13px; }
.pr-main .arrow { color: var(--text-3); font-size: 13px; }
.pr-main b { font-size: 16px; font-weight: 600; }
.pr-main .k { font-size: 12.5px; color: var(--text-3); }
.pr-main .chip { align-self: center; }
.cp-line { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); min-width: 0; }
.cp-line svg { width: 15px; height: 15px; flex: none; color: var(--accent-text); }
.cp { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: var(--surface); }
.cp.applied { border-color: color-mix(in srgb, var(--pos) 45%, transparent); background: color-mix(in srgb, var(--pos-soft) 55%, var(--surface)); }
.cp.not { background: var(--surface-2); }
.cp-h { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.cp-h b.grow { font-weight: 600; }
.cp-kv { margin-top: 8px; font-size: 12.5px; }
.cp-kv dd { text-align: left; color: var(--text-2); }
.cp .steps li { font-size: 13px; }
/* action badge (primary) + lottery plan */
.act { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; flex: none; }
.act.buy { background: var(--pos); color: var(--surface); }
.act.lot { background: var(--gS); color: var(--gS-ink); }
.act.watch { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 50%, transparent); }
.act.none { background: var(--surface-2); color: var(--text-3); }
.act.hunt { background: var(--info-soft); color: var(--info); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--info) 45%, transparent); }
.act.hp { background: var(--hp-soft); color: var(--hp); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hp) 55%, transparent); }
.act.wait { background: var(--accent-soft); color: var(--accent-text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.act-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
.section-h .act, details.section > summary .act { height: 28px; font-size: 13.5px; padding: 0 11px; }
.lot-box { border-radius: 10px; padding: 8px 10px; background: color-mix(in srgb, var(--gS) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--gS) 30%, transparent); }
.lot-box.big { margin-bottom: 10px; }
.lot-row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 6px; font-size: 12.5px; padding: 2px 0; }
.lot-k { color: var(--text-3); font-weight: 600; }
.lot-v { min-width: 0; }
.warnc { color: var(--warn); }
/* match review */
.match-box { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 10px 12px; background: var(--surface); cursor: default; }
.match-box.compact { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.mb-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.mb-col { min-width: 0; background: var(--surface-2); border-radius: 10px; padding: 8px; }
.match-box.compact .mb-col { background: var(--surface); }
.mb-l { display: block; font-size: 11px; font-weight: 600; color: var(--text-3); margin-bottom: 4px; letter-spacing: .02em; }
.mb-t { font-size: 13px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mb-col .thumb.sm { width: 40px; height: 40px; }
.mb-ln { font-size: 12.5px; color: var(--text-2); margin-top: 2px; overflow-wrap: anywhere; }
.mb-k { color: var(--text-3); font-size: 11.5px; font-weight: 500; margin-right: 4px; }
.mb-info { margin-top: 8px; display: grid; gap: 6px; }
.mb-inforow { font-size: 12.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.mb-why { margin: 2px 0 0; padding-left: 18px; flex-basis: 100%; color: var(--text-2); }
.mb-raw { margin-top: 2px; font-size: 12px; }
.mb-raw summary { cursor: pointer; color: var(--text-3); min-height: 28px; }
.mb-raw pre { margin: 4px 0 0; padding: 8px; background: var(--surface-2); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; font-size: 11.5px; }
.mb-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.mb-btns .btn { min-height: var(--tap); padding: 0 6px; white-space: normal; line-height: 1.2; font-size: 13px; }
.mb-btns .btn.on.ok { background: var(--pos); border-color: var(--pos); color: var(--surface); }
.mb-btns .btn.on.bad { background: var(--neg); border-color: var(--neg); color: var(--surface); }
.mb-btns .btn.on.warn { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.match-box .input { min-height: 40px; }
/* ============================================================ detail content */
.d-head { display: flex; gap: 12px; align-items: flex-start; }
.d-head h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.d-sec { margin-top: 18px; }
.d-sec > h4 { font-size: 13px; font-weight: 600; color: var(--text-3); margin-bottom: 8px; letter-spacing: 0; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 13.5px; }
.kv dt { color: var(--text-3); white-space: nowrap; }
.kv dd { margin: 0; text-align: right; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: right; font-weight: 500; color: var(--text-3); font-size: 11.5px; padding: 6px 4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td .sub { display: block; font-size: 11px; color: var(--text-3); font-weight: 500; }
.tbl td b { font-weight: 600; }
.note { font-size: 12.5px; color: var(--text-2); background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 4px 0 4px 32px; font-size: 13.5px; min-height: 28px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 auto; }

/* ============================================================ stores */
.map-card { padding: 10px; }
.map-svg { width: 100%; height: auto; max-height: 330px; display: block; margin: 0 auto; }
.map-svg .loop { fill: none; stroke: var(--border-strong); stroke-width: 2.5; stroke-dasharray: 2 5; stroke-linecap: round; }
.map-svg .st circle { fill: var(--surface); stroke: var(--text-3); stroke-width: 1.5; }
.map-svg .st text { fill: var(--text-3); font-size: 11px; font-weight: 500; }
.map-svg .b circle { fill: var(--accent); fill-opacity: .2; stroke: var(--accent); stroke-width: 2; }
.map-svg .b.hasS circle { fill: var(--gS); stroke: var(--gS); fill-opacity: 1; }
.map-svg .b text { fill: var(--text); font-size: 12px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.map-svg .b text.c { fill: var(--accent-text); stroke: none; font-size: 11px; font-weight: 600; }
.map-svg .b.hasS text.c { fill: var(--gS-ink); }
.map-svg .b { cursor: pointer; }
.map-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-3); padding: 4px 4px 0; }
.map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }

.region-h { display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; margin: 20px 2px 10px; }
.region-h h2 { font-size: 17px; font-weight: 600; }
.bld { cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.bld.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.bld-top { display: flex; gap: 10px; align-items: flex-start; }
.prio { flex: none; width: 44px; text-align: center; border-radius: 10px; background: var(--surface-2); padding: 4px 0; }
.prio b { display: block; font-size: 18px; font-weight: 600; line-height: 1.1; }
.prio span { font-size: 10.5px; color: var(--text-3); font-weight: 600; }
.prio.p1 { background: var(--accent); color: var(--accent-ink); }
.prio.p1 span { color: inherit; opacity: .85; }
.bld h3 { font-size: 16px; font-weight: 600; }
.bld .ja { font-size: 12px; color: var(--text-3); }
.bld-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.bld-stats > div { background: var(--surface-2); border-radius: 9px; padding: 6px 8px; min-width: 0; }
.bld-stats label { display: block; font-size: 11px; color: var(--text-3); font-weight: 500; }
.bld-stats b { font-size: 14.5px; font-weight: 600; white-space: nowrap; }

details.floor { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); margin-top: 8px; }
details.pq { margin: 8px 0 4px; }
.pq-list { list-style: none; margin: 0; padding: 0; }
.pq-i { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); }
.pq-i:first-child { border-top: 0; }
.pq-t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pq-i .chip { flex: none; }
details.floor > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; }
details.floor > summary::-webkit-details-marker { display: none; }
details.floor > summary .fl { flex: none; min-width: 44px; height: 30px; padding: 0 8px; border-radius: 8px; background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px; display: grid; place-items: center; }
details.floor > summary .chev { margin-left: auto; width: 18px; height: 18px; color: var(--text-3); transition: transform .15s; flex: none; }
details.floor[open] > summary .chev { transform: rotate(90deg); }
.floor-body { padding: 4px 12px 12px; border-top: 1px solid var(--border); }
.shop { padding: 10px 0; border-bottom: 1px dashed var(--border); }
.shop:last-child { border-bottom: 0; }
.shop-h { font-weight: 600; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.mini-rec { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0 0; min-width: 0; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; }
.mini-rec .t { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini-rec .m { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 12px; color: var(--text-3); }
.mini-rec b { white-space: nowrap; font-size: 15px; margin-left: auto; }

.check { display: flex; align-items: flex-start; gap: 10px; min-height: var(--tap); padding: 8px 0; cursor: pointer; border-bottom: 1px solid var(--border); }
.check:last-child { border-bottom: 0; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border-strong); display: grid; place-items: center; margin-top: 1px; background: var(--surface); }
.check .box svg { width: 16px; height: 16px; color: var(--accent-ink); opacity: 0; }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box svg { opacity: 1; }
.check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.check .txt { flex: 1; min-width: 0; font-size: 13.5px; }
.check .txt small { display: block; color: var(--text-3); font-size: 12px; }
.check input:checked ~ .txt { color: var(--text-3); text-decoration: line-through; }
.check .kind { flex: none; font-size: 11px; font-weight: 600; color: var(--text-3); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin-top: 3px; }
.progress { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.progress.over > i { background: var(--neg); }
pre.memo { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.6 var(--font); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; max-height: 260px; overflow: auto; color: var(--text-2); }

/* ============================================================ ledger */
.budget { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
